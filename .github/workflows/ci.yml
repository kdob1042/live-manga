name: Live Manga CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil fonts-dejavu-core
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build && npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-validation
          path: |
            test-results/
            dist/
